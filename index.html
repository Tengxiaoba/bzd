<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配音工厂 - AI智能配音平台</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
        .header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.1)}
        .logo{font-size:18px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
        .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:8px;display:flex;align-items:center;justify-content:center}
        .user-area{display:flex;align-items:center;gap:12px}
        .credit-box{padding:6px 12px;background:rgba(255,255,255,0.05);border-radius:16px;font-size:12px}
        .credit-val{color:#667eea;font-weight:600}
        .btn-sm{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#aaa;transition:all .2s}
        .btn-sm:hover{background:rgba(255,255,255,0.1);color:#fff}
        .main{padding:20px;max-width:1500px;margin:0 auto}
        .card{background:#12121a;border-radius:12px;padding:20px;border:1px solid rgba(255,255,255,0.08);margin-bottom:20px}
        .section-title{font-size:14px;color:#888;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .text-area{width:100%;height:160px;background:#0d0d14;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px;color:#e0e0e0;font-size:14px;resize:none;outline:none;font-family:inherit}
        .text-area:focus{border-color:#667eea}
        .text-area::placeholder{color:#555}
        .params{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:16px}
        .param-item{display:flex;flex-direction:column;gap:6px}
        .param-label{font-size:12px;color:#888;display:flex;justify-content:space-between}
        .param-val{color:#667eea;font-weight:600}
        .slider{width:100%;height:4px;-webkit-appearance:none;background:#333;border-radius:2px;outline:none}
        .slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:50%;cursor:pointer}
        .btn-row{display:flex;gap:12px;margin-top:16px}
        .btn{padding:12px 24px;border-radius:8px;font-size:14px;cursor:pointer;transition:all .3s;border:none;font-weight:600}
        .btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(102,126,234,0.4)}
        .btn-secondary{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#aaa}
        .btn-secondary:hover{background:rgba(255,255,255,0.1);color:#fff}
        .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .voice-toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
        .filter-select{padding:6px 10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#aaa;font-size:12px;outline:none}
        .filter-select:focus{border-color:#667eea}
        .search-input{padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:12px;outline:none;width:180px}
        .search-input:focus{border-color:#667eea}
        .search-input::placeholder{color:#555}
        .voice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-height:500px;overflow-y:auto;padding-right:8px}
        .voice-grid::-webkit-scrollbar{width:6px}
        .voice-grid::-webkit-scrollbar-track{background:transparent}
        .voice-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
        .voice-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;cursor:pointer;transition:all .3s;position:relative}
        .voice-card:hover{background:rgba(102,126,234,0.1);border-color:rgba(102,126,234,0.3)}
        .voice-card.selected{background:rgba(102,126,234,0.15);border-color:#667eea}
        .voice-avatar{width:44px;height:44px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
        .voice-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;word-break:break-all}
        .voice-info{font-size:11px;color:#666;margin-bottom:6px}
        .voice-tags{display:flex;gap:4px;flex-wrap:wrap}
        .tag{padding:2px 6px;background:rgba(255,255,255,0.05);border-radius:3px;font-size:10px;color:#888}
        .voice-card.selected .tag{background:rgba(102,126,234,0.2);color:#8b9bf3}
        .preview-btn{position:absolute;top:10px;right:10px;width:26px;height:26px;background:rgba(255,255,255,0.1);border:none;border-radius:50%;color:#aaa;cursor:pointer;font-size:11px;transition:all .3s}
        .preview-btn:hover{background:#667eea;color:#fff}
        .voice-card.selected .preview-btn{background:#667eea;color:#fff}
        .audio-player{margin-top:16px;padding:16px;background:rgba(102,126,234,0.08);border:1px solid rgba(102,126,234,0.2);border-radius:10px;display:none}
        .audio-player.show{display:block}
        .player-row{display:flex;align-items:center;gap:14px}
        .play-btn{width:44px;height:44px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;border-radius:50%;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
        .play-btn:hover{transform:scale(1.05)}
        .wave{height:36px;background:#1a1a2e;border-radius:6px;flex:1;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 12px}
        .wave span{width:3px;height:15px;background:#667eea;border-radius:2px;animation:wave 1s ease-in-out infinite}
        .wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}.wave span:nth-child(5){animation-delay:.4s}.wave span:nth-child(6){animation-delay:.5s}
        @keyframes wave{0%,100%{height:8px}50%{height:24px}}
        .time{font-size:12px;color:#888;min-width:70px}
        .download-btn{flex:1;padding:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#ccc;font-size:12px;cursor:pointer;transition:all .3s}
        .download-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
        .loading{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000}
        .loading.show{display:flex}
        .loading-content{text-align:center}
        .spinner{width:50px;height:50px;border:3px solid rgba(255,255,255,0.1);border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loading-text{color:#fff;font-size:14px}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);padding:12px 24px;border-radius:8px;color:#fff;font-size:13px;z-index:1001;transition:transform .3s}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .toast.success{border-color:#4caf50}
        .toast.error{border-color:#f44336}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1002}
        .modal.hidden{display:none}
        .modal-box{background:#12121a;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px;width:400px}
        .modal-title{font-size:18px;font-weight:600;color:#fff;margin-bottom:8px}
        .modal-desc{font-size:13px;color:#666;margin-bottom:20px;line-height:1.6}
        .modal-input{width:100%;padding:12px 14px;background:#0d0d14;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:13px;outline:none;margin-bottom:16px}
        .modal-input:focus{border-color:#667eea}
        .modal-btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
        .modal-btn:hover{transform:translateY(-1px)}
        .loading-voices{text-align:center;padding:40px;color:#666}
        .two-col{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}
        @media(max-width:1000px){.two-col{grid-template-columns:1fr}.main{padding:16px}}
    </style>
</head>
<body>
<div class="modal" id="apiModal">
<div class="modal-box">
<div class="modal-title">设置 MiniMax API Key</div>
<div class="modal-desc">请输入您的 MiniMax 国际版 API Key</div>
<input type="password" class="modal-input" id="apiKeyInput" placeholder="输入 API Key">
<button class="modal-btn" onclick="saveApiKey()">确认</button>
</div>
</div>

<header class="header">
<div class="logo"><div class="logo-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>配音工厂</div>
<div class="user-area">
<span class="credit-box">音色数量: <span class="credit-val" id="voiceCount">0</span></span>
<button class="btn-sm" onclick="reloadVoices()">🔄 刷新音色</button>
<button class="btn-sm" onclick="showSettings()">⚙️ 设置</button>
</div>
</header>

<main class="main">
<div class="two-col">
<div>
<div class="card">
<div class="section-title">📝 输入配音文案</div>
<textarea class="text-area" id="textInput" placeholder="请输入要转换的文案..."></textarea>
<div class="params">
<div class="param-item"><div class="param-label"><span>语速</span><span class="param-val" id="speedVal">1.0x</span></div><input type="range" class="slider" id="speedSlider" min="50" max="200" value="100" oninput="updateParam('speed')"></div>
<div class="param-item"><div class="param-label"><span>音量</span><span class="param-val" id="volVal">100%</span></div><input type="range" class="slider" id="volSlider" min="0" max="100" value="100" oninput="updateParam('vol')"></div>
<div class="param-item"><div class="param-label"><span>音高</span><span class="param-val" id="pitchVal">0</span></div><input type="range" class="slider" id="pitchSlider" min="-500" max="500" value="0" oninput="updateParam('pitch')"></div>
<div class="param-item"><div class="param-label"><span>停顿</span><span class="param-val" id="pauseVal">0s</span></div><input type="range" class="slider" id="pauseSlider" min="0" max="2" value="0" step="0.5" oninput="updateParam('pause')"></div>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="generateBtn" onclick="generateAudio()">🎵 生成配音</button>
<button class="btn btn-secondary" onclick="previewVoice()">▶ 试听</button>
</div>
<div class="audio-player" id="audioPlayer">
<div class="player-row">
<button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
<div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="time" id="audioTime">00:00 / 00:00</div>
</div>
<div class="btn-row" style="margin-top:12px">
<button class="download-btn" onclick="downloadAudio()">⬇️ 下载音频</button>
</div>
</div>
</div>
</div>

<div class="card">
<div class="section-title">🎭 选择音色</div>
<div class="voice-toolbar">
<div style="display:flex;gap:8px;margin-bottom:10px;width:100%">
<button class="btn btn-sm" id="libraryBtn" onclick="switchVoiceSource('library')" style="background:rgba(102,126,234,0.2);color:#8b9bf3">📚 库</button>
<button class="btn btn-sm" id="collectedBtn" onclick="switchVoiceSource('collected')" style="background:transparent">⭐ 收藏</button>
</div>
<select class="filter-select" id="genderFilter" onchange="filterVoices()"><option value="">全部性别</option><option value="男">男声</option><option value="女">女声</option><option value="未知">其他</option></select>
<select class="filter-select" id="sourceFilter" onchange="filterVoices()" style="display:none"><option value="">全部来源</option><option value="库">库</option><option value="收藏">收藏</option></select>
<input type="text" class="search-input" id="searchInput" placeholder="搜索音色名称..." oninput="filterVoices()">
</div>
<div class="voice-grid" id="voiceGrid">
<div class="loading-voices">正在加载音色库...</div>
</div>
</div>
</div>
</div>
</main>

<div class="loading" id="loading"><div class="loading-content"><div class="spinner"></div><div class="loading-text" id="loadingText">正在生成配音...</div></div></div>
<div class="toast" id="toast"></div>

<script>
let allVoices = [];
let selectedVoice = null;
let currentAudio = null;
let isPlaying = false;
let generatedAudio = null;
let currentVoiceSource = 'library';

document.addEventListener("DOMContentLoaded", () => {
    checkApiKey();
});

function checkApiKey() {
    const key = localStorage.getItem("minimax_api_key");
    if (!key) {
        document.getElementById("apiModal").classList.remove("hidden");
    } else {
        loadVoices();
    }
}

function saveApiKey() {
    const key = document.getElementById("apiKeyInput").value.trim();
    if (key) {
        localStorage.setItem("minimax_api_key", key);
        document.getElementById("apiModal").classList.add("hidden");
        showToast("API Key 设置成功", "success");
        loadVoices();
    } else {
        showToast("请输入有效的 API Key", "error");
    }
}

function switchVoiceSource(source) {
    currentVoiceSource = source;
    document.getElementById('libraryBtn').style.cssText = source === 'library' ? 'background:rgba(102,126,234,0.2);color:#8b9bf3' : 'background:transparent';
    document.getElementById('collectedBtn').style.cssText = source === 'collected' ? 'background:rgba(102,126,234,0.2);color:#8b9bf3' : 'background:transparent';
    loadVoices();
}

async function loadVoices() {
    const apiKey = localStorage.getItem("minimax_api_key");
    if (!apiKey) return;
    
    const grid = document.getElementById("voiceGrid");
    grid.innerHTML = '<div class="loading-voices">正在加载音色库...</div>';
    
    try {
        const res = await fetch(`/api/voices?api_key=${encodeURIComponent(apiKey)}&source=${currentVoiceSource}`);
        const data = await res.json();
        
        if (data.success && data.voices) {
            allVoices = data.voices;
            document.getElementById("voiceCount").textContent = data.total;
            filterVoices();
            showToast(`加载了 ${data.total} 个音色`, "success");
        } else {
            grid.innerHTML = '<div class="loading-voices">加载失败: ' + (data.error || "未知错误") + '</div>';
            showToast(data.error || "加载音色失败", "error");
        }
    } catch (e) {
        grid.innerHTML = '<div class="loading-voices">加载失败: ' + e.message + '</div>';
        showToast("加载音色失败", "error");
    }
}

function reloadVoices() {
    loadVoices();
}

function filterVoices() {
    const gender = document.getElementById("genderFilter").value;
    const source = document.getElementById("sourceFilter").value;
    const search = document.getElementById("searchInput").value.toLowerCase();
    
    let filtered = allVoices;
    
    if (gender) {
        filtered = filtered.filter(v => v.gender === gender);
    }
    if (source) {
        filtered = filtered.filter(v => v.source === source);
    }
    if (search) {
        filtered = filtered.filter(v => 
            v.name.toLowerCase().includes(search) || 
            v.id.toLowerCase().includes(search)
        );
    }
    
    renderVoices(filtered);
}

function renderVoices(voices) {
    const grid = document.getElementById("voiceGrid");
    
    if (voices.length === 0) {
        grid.innerHTML = '<div class="loading-voices">没有找到匹配的音色</div>';
        return;
    }
    
    grid.innerHTML = voices.map((v, i) => `
        <div class="voice-card ${selectedVoice && selectedVoice.id === v.id ? 'selected' : ''}" onclick="selectVoice(${i})">
            <button class="preview-btn" onclick="event.stopPropagation(); previewVoiceByIndex(${i})">▶</button>
            <div class="voice-avatar">${v.gender === '女' ? '👩' : v.gender === '男' ? '👨' : '🎤'}</div>
            <div class="voice-name">${escapeHtml(v.name)}</div>
            <div class="voice-info">${v.gender}声</div>
            <div class="voice-tags">
                <span class="tag">${v.source}</span>
                ${v.tags.slice(0, 2).map(t => `<span class="tag">${escapeHtml(t.substring(0, 15))}</span>`).join('')}
            </div>
        </div>
    `).join('');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function selectVoice(index) {
    selectedVoice = allVoices[index];
    filterVoices();
    showToast("已选择: " + selectedVoice.name, "success");
}

function previewVoiceByIndex(index) {
    const voice = allVoices[index];
    const sampleText = voice.id.includes("Chinese") || voice.id.includes("Mandarin") ? 
        "你好，欢迎使用配音工厂，这里是样音试听。" :
        voice.id.includes("English") ?
        "Hello, welcome to Voice Factory. This is a sample preview." :
        "你好，声音试听。";
    
    generateAndPlay(sampleText, voice.id, voice.name);
}

function previewVoice() {
    if (!selectedVoice) {
        showToast("请先选择一个音色", "error");
        return;
    }
    const text = selectedVoice.id.includes("Chinese") || selectedVoice.id.includes("Mandarin") ?
        "你好，欢迎使用配音工厂，这里是样音试听。" :
        selectedVoice.id.includes("English") ?
        "Hello, welcome to Voice Factory. This is a sample preview." :
        "你好，声音试听。";
    generateAndPlay(text, selectedVoice.id, selectedVoice.name);
}

function updateParam(type) {
    if (type === "speed") {
        const v = (document.getElementById("speedSlider").value / 100).toFixed(1);
        document.getElementById("speedVal").textContent = v + "x";
    } else if (type === "vol") {
        document.getElementById("volVal").textContent = document.getElementById("volSlider").value + "%";
    } else if (type === "pitch") {
        document.getElementById("pitchVal").textContent = document.getElementById("pitchSlider").value;
    } else if (type === "pause") {
        document.getElementById("pauseVal").textContent = document.getElementById("pauseSlider").value + "s";
    }
}

async function generateAudio() {
    const text = document.getElementById("textInput").value.trim();
    if (!text) {
        showToast("请输入文案", "error");
        return;
    }
    if (!selectedVoice) {
        showToast("请选择音色", "error");
        return;
    }
    
    const apiKey = localStorage.getItem("minimax_api_key");
    if (!apiKey) {
        document.getElementById("apiModal").classList.remove("hidden");
        return;
    }
    
    showLoading(true, "正在生成配音...");
    
    try {
        const res = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                text: text,
                voice_id: selectedVoice.id,
                api_key: apiKey
            })
        });
        
        const data = await res.json();
        showLoading(false);
        
        if (data.success && data.audio_data) {
            generatedAudio = data.audio_data;
            document.getElementById("audioPlayer").classList.add("show");
            showToast("配音生成成功！", "success");
            playAudio(data.audio_data);
        } else {
            showToast(data.error || "生成失败", "error");
        }
    } catch (e) {
        showLoading(false);
        showToast("请求失败: " + e.message, "error");
    }
}

function generateAndPlay(text, voiceId, voiceName) {
    const apiKey = localStorage.getItem("minimax_api_key");
    if (!apiKey) {
        document.getElementById("apiModal").classList.remove("hidden");
        return;
    }
    
    showLoading(true, "正在生成试听...");
    
    fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            text: text,
            voice_id: voiceId,
            api_key: apiKey
        })
    }).then(res => res.json())
      .then(data => {
          showLoading(false);
          if (data.success && data.audio_data) {
              showToast("试听: " + voiceName, "success");
              playAudio(data.audio_data);
          } else {
              showToast(data.error || "试听失败", "error");
          }
      })
      .catch(e => {
          showLoading(false);
          showToast("试听失败: " + e.message, "error");
      });
}

function playAudio(audioData) {
    if (currentAudio) currentAudio.pause();
    currentAudio = new Audio(audioData);
    currentAudio.play();
    isPlaying = true;
    document.getElementById("playBtn").textContent = "⏸";
    currentAudio.onloadedmetadata = () => {
        document.getElementById("audioTime").textContent = "00:00 / " + formatTime(currentAudio.duration);
    };
    currentAudio.ontimeupdate = () => {
        if (currentAudio.duration) {
            document.getElementById("audioTime").textContent = formatTime(currentAudio.currentTime) + " / " + formatTime(currentAudio.duration);
        }
    };
    currentAudio.onended = () => {
        isPlaying = false;
        document.getElementById("playBtn").textContent = "▶";
    };
}

function togglePlay() {
    if (!currentAudio) return;
    if (isPlaying) currentAudio.pause();
    else currentAudio.play();
    isPlaying = !isPlaying;
    document.getElementById("playBtn").textContent = isPlaying ? "⏸" : "▶";
}

function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
}

function downloadAudio() {
    if (!generatedAudio) {
        showToast("请先生成配音", "error");
        return;
    }
    const a = document.createElement("a");
    a.href = generatedAudio;
    a.download = "配音_" + Date.now() + ".mp3";
    a.click();
    showToast("下载开始", "success");
}

function showLoading(show, text = "处理中...") {
    document.getElementById("loading").classList[show ? "add" : "remove"]("show");
    document.getElementById("loadingText").textContent = text;
}

function showToast(msg, type = "info") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast " + type + " show";
    setTimeout(() => t.classList.remove("show"), 3000);
}

function showSettings() {
    const key = localStorage.getItem("minimax_api_key");
    if (key) {
        if (confirm("清除已保存的 API Key？")) {
            localStorage.removeItem("minimax_api_key");
            showToast("已清除，请重新输入", "info");
            document.getElementById("apiModal").classList.remove("hidden");
        }
    } else {
        document.getElementById("apiModal").classList.remove("hidden");
    }
}
</script>
</body>
</html>
